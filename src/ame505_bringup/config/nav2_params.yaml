# AME 505 Nav2 parameters (JetAuto, mecanum base).
#
# Localization (map -> odom):
#   * 2D (default): map_server serves maps_2d/<map>.yaml, AMCL matches the lidar to it
#     (navigation_2d.launch.py; amcl + map_server sections at the end of this file)
#   * legacy 3D: RTAB-Map localization on maps/<map>.db (navigation.launch.py)
#
# Sensors used for navigation:
#   * saved 2D map              /map                (static layer, global costmap)
#   * lidar, real time          /scan               (global + local costmap, collision monitor)
#   * depth camera, real time   /depth_cam/points   (global + local costmap, collision monitor)
#                               made by depth_obstacles.py from the Astra depth image
#   * wheel odometry + IMU      /odom (EKF)         (controller, velocity smoother)
#
# Real-time data overrides the saved map: the global lidar layer uses
# combination_method 0 (overwrite), so cells the lidar currently sees as FREE erase stale
# obstacles stored in the saved map, and anything it hits is marked at once.
#
# Output chain: controller -> cmd_vel_nav -> velocity_smoother -> cmd_vel_smoothed
#               -> collision_monitor (stop / slow down before contact) -> /cmd_vel -> motors.

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    # ms the BT waits for planner/controller to ACCEPT a request. Nav2's default 20 ms is
    # far too short on the busy Jetson Nano: goals aborted at once with "Timed out while
    # waiting for action server to acknowledge goal request for compute_path_to_pose".
    default_server_timeout: 1000
    wait_for_service_timeout: 5000
    # default_nav_to_pose_bt_xml is set by nav2_stack.launch.py -> config/navigate_no_spin.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

# ---------------------------------------------------------------------------------------
# Controller: DWB with HOLONOMIC sampling (mecanum wheels can strafe), so the robot follows
# the path without stopping to rotate in place. Slow, conservative speeds for indoors.
controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 8.0          # Jetson Nano: 10 Hz was missed constantly
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001    # was 0.5 -> every sideways command was dropped
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath", "FollowPathRPP"]   # second one = fallback when stuck
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 10.0      # was 15: hand over to the fallback controller sooner
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: True
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.30
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False
      min_vel_x: 0.0                   # no reversing: nothing watches behind the robot well
      max_vel_x: 0.20
      min_vel_y: -0.15
      max_vel_y: 0.15
      max_vel_theta: 0.6
      min_speed_xy: 0.0
      max_speed_xy: 0.22
      min_speed_theta: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 1.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.0
      decel_lim_y: -1.0
      decel_lim_theta: -2.0
      vx_samples: 6                    # AME505: 6x5x10 = 300 trajectories (was 672) - Nano CPU
      vy_samples: 5
      vtheta_samples: 10
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.05
      transform_tolerance: 1.0         # AME505: odom->map from AMCL can be ~0.3-1 s old on the loaded Nano
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.05         # prefer trajectories that keep clear of obstacles
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 16.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

    # Fallback controller. config/navigate_no_spin.xml switches to it for the rest of a leg when
    # FollowPath (above) stops making progress. In simulation DWB stood still at 0.8-1.0 m gaps
    # (doorway, a box that is not on the map); pure pursuit follows the path and just slows down.
    # It does not strafe: it turns on the spot, then drives forward. Not tuned on the robot.
    FollowPathRPP:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.20             # same top speed as the DWB config
      lookahead_dist: 0.40
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.60
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 0.6   # same as DWB max_vel_theta
      max_angular_accel: 2.0
      transform_tolerance: 1.0             # AME505: odom->map from AMCL can be ~0.3-1 s old on the loaded Nano
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.4
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true   # slower near walls instead of refusing to go
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.08
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.6     # path more than ~35 deg off the heading -> turn on the spot first
      allow_reversing: false               # nothing watches behind the robot
      max_robot_pose_search_dist: 2.0

# ---------------------------------------------------------------------------------------
# Footprint: JetAuto chassis 0.297 m x ~0.25 m incl. wheels, plus 1-2 cm margin.
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 1.0       # AME505: AMCL/EKF TF lags under load
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.165, 0.14], [0.165, -0.14], [-0.165, -0.14], [-0.165, 0.14]]"
      plugins: ["lidar_layer", "depth_layer", "inflation_layer"]
      lidar_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
      depth_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 10
        max_obstacle_height: 0.5       # robot height + margin; ceiling/tables above ignored
        mark_threshold: 0
        observation_sources: depth
        depth:
          topic: /depth_cam/points
          data_type: "PointCloud2"
          min_obstacle_height: 0.06    # below = floor
          max_obstacle_height: 0.5
          clearing: True
          marking: True
          raytrace_max_range: 3.0
          raytrace_min_range: 0.2
          obstacle_max_range: 2.5
          obstacle_min_range: 0.2
          observation_persistence: 0.0
          expected_update_rate: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.30
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 1.0       # AME505: AMCL/EKF TF lags under load
      use_sim_time: False
      footprint: "[[0.165, 0.14], [0.165, -0.14], [-0.165, -0.14], [-0.165, 0.14]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "lidar_layer", "depth_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      lidar_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        track_unknown_space: true      # unseen cells stay "no info" and keep the saved map
        combination_method: 0          # OVERWRITE: live lidar beats the saved map
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.5
          obstacle_min_range: 0.0
      depth_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        track_unknown_space: true
        combination_method: 1          # MAX: depth only ADDS obstacles (tables, low objects)
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 10
        max_obstacle_height: 0.5
        mark_threshold: 0
        observation_sources: depth
        depth:
          topic: /depth_cam/points
          data_type: "PointCloud2"
          min_obstacle_height: 0.06
          max_obstacle_height: 0.5
          clearing: True
          marking: True
          raytrace_max_range: 3.0
          raytrace_min_range: 0.2
          obstacle_max_range: 2.5
          obstacle_min_range: 0.2
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.35         # paths keep away from walls
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # Spin/BackUp stay loaded (other trees may use them) but navigate_no_spin.xml does not.
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 1.0
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.3
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 10.0          # AME505: matches the 8 Hz controller
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.20, 0.15, 0.6]    # y was 0.0 -> sideways motion was removed here too
    min_velocity: [-0.05, -0.15, -0.6]
    max_accel: [0.6, 0.6, 1.5]
    max_decel: [-0.8, -0.8, -2.0]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# ---------------------------------------------------------------------------------------
# Last line of defence, independent of the planner: watches the RAW sensors every cycle.
collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.5
    source_timeout: 2.0                # a dead sensor -> robot stops
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop", "FootprintApproach"]
    # Front band: anything within ~15 cm of the front bumper -> stop. (The lidar sits at
    # x=0.096 and ignores returns < 0.2 m, so the zone must reach past x=0.30 to see them.)
    PolygonStop:
      type: "polygon"
      points: [0.32, 0.18, 0.32, -0.18, 0.10, -0.18, 0.10, 0.18]
      action_type: "stop"
      max_points: 3
      visualize: True
      polygon_pub_topic: "polygon_stop"
    FootprintApproach:                 # slow down so contact is never reached within 1.5 s
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.5
      simulation_time_step: 0.1
      max_points: 3
      visualize: False
    observation_sources: ["scan", "depth"]
    scan:
      type: "scan"
      topic: "/scan"
    depth:
      type: "pointcloud"
      topic: "/depth_cam/points"
      min_height: 0.06
      max_height: 0.5

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

# ---------------------------------------------------------------------------------------
# 2D localization (navigation_2d.launch.py): saved map + AMCL particle filter on the lidar.
map_server:
  ros__parameters:
    use_sim_time: False
    # yaml_filename is set by the launch file (maps_2d/<map>.yaml)

amcl:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: scan
    map_topic: map
    robot_model_type: "nav2_amcl::OmniMotionModel"   # mecanum: moves sideways too
    # odometry noise. Mecanum wheels slip, especially sideways and when turning.
    alpha1: 0.25        # rotation noise from rotation
    alpha2: 0.2         # rotation noise from translation
    alpha3: 0.2         # translation noise from translation
    alpha4: 0.2         # translation noise from rotation
    alpha5: 0.25        # strafe noise (omni model only)
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_min_range: 0.2           # same as the A1 laser filter; ignores the robot body
    laser_max_range: 8.0
    max_beams: 60                  # the filtered A1 scan covers the front ~180 deg
    sigma_hit: 0.2
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5                    # people / chairs that are not in the map
    do_beamskip: false
    min_particles: 300
    max_particles: 1000            # Jetson Nano CPU budget
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    update_min_d: 0.10             # update every 10 cm / ~6 deg (defaults 0.25 m / 0.2 rad)
    update_min_a: 0.10
    tf_broadcast: true
    transform_tolerance: 1.5       # post-date map->odom so a few dropped scans don't break Nav2 TF lookups
    save_pose_rate: 0.5
    # Start pose: navigation_2d.launch.py fills initial_pose from the map's "home"
    # (default 0,0,0 = where mapping started). Wrong? Dashboard "Set pose".
    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
